[package]
name = "dev_caloptreyx_webhooks"
description = "Send panel and server events (power, crashes, state changes, backups, installs, ...) to webhook URLs such as Discord."
authors = ["Caloptreyx"]
version = "0.2.1"
edition = { workspace = true }

[dependencies]
shared = { workspace = true }
wings-api = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
axum = { workspace = true }
garde = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
uuid = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
minijinja = { workspace = true, features = ["fuel"] }
futures-util = { workspace = true }
# panel 1.2.10 dropped `url` from its workspace dependencies; 2.5 is in every panel's lockfile
url = "2.5"
parking_lot = { workspace = true }
